name: DevSecOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # -----------------------------------
  # 1. SAST
  # -----------------------------------

  sast:
    name: SAST - SonarQube
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # -----------------------------------
  # 2. SCA
  # -----------------------------------

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Dependency Scan
        run: |
          pip-audit -r requirements.txt


  # -----------------------------------
  # 3. Secret Scanning
  # -----------------------------------

  secrets:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # -----------------------------------
  # 4. Python Tests
  # -----------------------------------

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest


  # -----------------------------------
  # 5. Docker Build
  # -----------------------------------

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - test
      - secrets

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-python-app:${{ github.sha }} \
            .


  # -----------------------------------
  # 6. Container Security
  # -----------------------------------

  trivy:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t devsecops-python-app:${{ github.sha }} \
            .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-python-app:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'


  # -----------------------------------
  # 7. Deploy
  # -----------------------------------
  aws-configure:
    name: Configure AWS credentials
    runs-on: ubuntu-latest
    environemnt: DEV
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    needs:
      - sast
      - sca
      - trivy

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Deployment
        run: |
          echo "Deploying application..."
  DAST:
    name: Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://your-application.example.com'